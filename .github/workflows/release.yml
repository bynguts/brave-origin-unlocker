name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.0.1)"
        required: true
        default: "1.0.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: compile-win
            artifact: dist/unlock-win.exe
            name: unlock-win
          - os: macos-14
            task: compile-mac-arm
            artifact: dist/unlock-mac-arm
            name: unlock-mac-arm
          - os: macos-13
            task: compile-mac-x64
            artifact: dist/unlock-mac-x64
            name: unlock-mac-x64

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task ${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Compute checksums
        shell: bash
        run: |
          mkdir -p release
          cd dist-artifacts
          for f in */unlock-*; do
            cp "$f" "../release/$(basename "$f")"
          done
          cd ../release
          sha256sum unlock-* > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
