name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.0.1)"
        required: true
        default: "1.0.1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Resolved once: "v<input>" for a manual run, the pushed tag name otherwise.
env:
  REL_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: compile-win
            artifact: dist/unlock-win.exe
            name: unlock-win
          - os: macos-14
            task: compile-mac-arm
            artifact: dist/unlock-mac-arm
            name: unlock-mac-arm
          - os: macos-13
            task: compile-mac-x64
            artifact: dist/unlock-mac-x64
            name: unlock-mac-x64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Stamp version
        shell: bash
        run: |
          V="${REL_VERSION#v}"
          perl -0pi -e "s/const VERSION = \"[^\"]*\"/const VERSION = \"${V}\"/" unlock.ts
          grep -n 'const VERSION' unlock.ts

      - name: Build
        run: deno task ${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts

      - name: Compute checksums
        shell: bash
        run: |
          mkdir -p release
          cd dist-artifacts
          for f in */unlock-*; do
            cp "$f" "../release/$(basename "$f")"
          done
          cd ../release
          sha256sum unlock-* > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/unlock-*"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.REL_VERSION }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
